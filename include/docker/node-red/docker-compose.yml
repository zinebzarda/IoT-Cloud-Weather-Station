services:

  node-red:
    image: nodered/node-red:latest
    container_name: station-meteo-node-red
    ports:
      - "1880:1880"
    environment:
      - TZ=Africa/Casablanca
    volumes:
      - node-red-data:/data
    depends_on:
      - influxdb
    networks:
      - station-meteo-network

  influxdb:
    image: influxdb:2
    container_name: station-meteo-influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=station123456
      - DOCKER_INFLUXDB_INIT_ORG=ibntofail
      - DOCKER_INFLUXDB_INIT_BUCKET=station_meteo
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=station-meteo-token-123456
    volumes:
      - influxdb-data:/var/lib/influxdb2
    networks:
      - station-meteo-network

  grafana:
    image: grafana/grafana:latest
    container_name: station-meteo-grafana
    ports:
      - "3000:3000"
    environment:
      - TZ=Africa/Casablanca
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - influxdb
    networks:
      - station-meteo-network

volumes:
  node-red-data:
  influxdb-data:
  grafana-data:

networks:
  station-meteo-network:
    driver: bridge